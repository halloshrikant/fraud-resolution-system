---
# Secrets for sensitive configuration
# IMPORTANT: In production, use sealed-secrets or AWS Secrets Manager
# DO NOT commit real secrets to git
apiVersion: v1
kind: Secret
metadata:
  name: fraud-secrets
  namespace: fraud-system
type: Opaque
stringData:
  # AWS Cognito (used for JWT authentication)
  COGNITO_USER_POOL_ID: "us-east-1_XXXXXXXXX"  # Replace with real value
  COGNITO_CLIENT_ID: "xxxxxxxxxxxxxxxxxxxxxxxxxx"  # Replace with real value
  
  # Redis credentials (if using Redis Cloud)
  REDIS_PASSWORD: ""
  
  # AWS credentials (for Bedrock access)
  # In EKS, use IAM roles instead (recommended)
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  
  # Redis TLS certificates (for production)
  REDIS_TLS_CERT: ""
  REDIS_TLS_KEY: ""
  REDIS_CA_CERT: ""
